<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up - GLT-Garments</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page-body">

  <header class="navbar">
    <div class="logo"><a href="index.html" style="color:#fff; text-decoration:none;">GLT-Garments</a></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="tab-btn active" id="login-tab">Log In</button>
        <button class="tab-btn" id="signup-tab">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form active">
        <h2>Welcome Back</h2>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" class="auth-form">
        <h2>Create Account</h2>
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required placeholder="Create a password">
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
