<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="../css/style.css"></head>
<body style="display:grid;place-items:center;min-height:100vh;background:var(--navy)"><form id="f" class="card" style="width:min(340px,92vw)"><h2><i class="bi bi-shield-lock"></i> Admin login</h2><label>Username</label><input id="u"><label>Password</label><input id="p" type="password"><div class="err" id="e"></div><br><button class="btn">Log in</button><p style="font-size:.75rem;margin-top:10px">Demo only: admin / glt2026 (front-end login, not real security). <a href="../index.html">Back to shop</a></p></form>
<script>f.onsubmit=e=>{e.preventDefault();if(u.value=='admin'&&p.value=='glt2026'){sessionStorage.glt_admin=1;location='dashboard.html'}else document.getElementById('e').textContent='Wrong username or password.'}</script></body></html>
