<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="../css/style.css"></head>
<section><div class="wrap"><h2>Dashboard</h2><div class="grid" id="cards"></div><br><h2>Sales by product</h2><div class="card" id="chart"></div><br><h2>Orders</h2>
<input id="s" placeholder="Search orders..."><br><br><div class="tbl"><table><thead><tr><th>ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Order status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<br><button class="btn sm alt" id="reset"><i class="bi bi-arrow-repeat"></i> Reset demo data</button></div></section>
<div class="modal" id="pm"><div><img id="pimg" alt="Proof of payment"><br><button class="btn sm" onclick="pm.classList.remove('show')">Close</button></div></div>
<script src="../js/data.js"></script><script>
/* Admin dashboard: protected page, stats computed from saved orders */

const $=s=>document.querySelector(s),peso=n=>'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2});
const get=()=>JSON.parse(localStorage.getItem('glt_orders')||'[]'),save=o=>localStorage.setItem('glt_orders',JSON.stringify(o));
const STATUS=['Pending','In Production','Ready for Pickup','Completed'],PAY=['Unpaid','Waiting for Verification','Partially Paid','Paid'];
$('#out').onclick=()=>{sessionStorage.removeItem('glt_admin');location='login.html'};
$('#reset').onclick=()=>{localStorage.removeItem('glt_orders');location.reload()};
window.upd=(i,k,v)=>{const o=get();o[i][k]=v;if(k=='payStatus'){o[i].paid=v=='Paid'?o[i].total:v=='Partially Paid'?o[i].total/2:0;o[i].balance=o[i].total-o[i].paid}save(o);draw()};
window.del=i=>{if(confirm('Delete this order?')){const o=get();o.splice(i,1);save(o);draw()}};
window.proof=i=>{$('#pimg').src=get()[i].proof;$('#pm').classList.add('show')};
function draw(){const o=get(),q=$('#s').value.toLowerCase();
 const c=[['Total orders',o.length,'bag','--pur'],['Pending',o.filter(x=>x.status=='Pending').length,'hourglass','--or'],['Total sales',peso(o.reduce((a,x)=>a+x.total,0)),'graph-up','--teal'],['Total paid',peso(o.reduce((a,x)=>a+x.paid,0)),'cash-coin','--pink'],['Pending verification',o.filter(x=>x.payStatus=='Waiting for Verification').length,'patch-check','--yel'],['Unpaid balance',peso(o.reduce((a,x)=>a+x.balance,0)),'wallet2','--navy']];
 $('#cards').innerHTML=c.map(x=>`<div class="card" style="--c:var(${x[3]})"><i class="bi bi-${x[2]} ico"></i><p>${x[0]}</p><h3>${x[1]}</h3></div>`).join('');
 const by={};o.forEach(x=>x.items.forEach(i=>{const p=PRODUCTS.find(p=>p.id==i.pid);by[p.name]=(by[p.name]||0)+i.qty*p.price}));const mx=Math.max(1,...Object.values(by));
 $('#chart').innerHTML=Object.entries(by).map(([n,v],k)=>`<p style="font-size:.85rem">${n} - ${peso(v)}</p><div style="height:14px;border-radius:99px;width:${v/mx*100}%;background:${PRODUCTS.find(p=>p.name==n).color};transition:.6s;margin-bottom:8px"></div>`).join('');
 $('#rows').innerHTML=o.map((x,i)=>[x,i]).filter(([x])=>(x.id+x.name+x.phone).toLowerCase().includes(q)).map(([x,i])=>`<tr><td>${x.id}</td><td>${x.name}<br>${x.phone}</td><td>${x.items.map(t=>t.qty+'× '+PRODUCTS.find(p=>p.id==t.pid).name).join('<br>')}</td><td>${peso(x.total)}</td><td>${x.pay}<br><select onchange="upd(${i},'payStatus',this.value)">${PAY.map(s=>`<option ${s==x.payStatus?'selected':''}>${s}</option>`).join('')}</select>${x.proof?`<br><a href="#" onclick="proof(${i});return false"><i class="bi bi-image"></i> Proof</a>`:''}</td><td><select onchange="upd(${i},'status',this.value)">${STATUS.map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn sm" onclick="del(${i})"><i class="bi bi-trash"></i></button></td></tr>`).join('')}
$('#s').oninput=draw;draw();
</script></body></html>
